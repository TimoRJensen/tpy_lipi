[project]
name = "tpy_lipi"
version = "0.1.0"
description = "A Python app for daily reflections: capture thoughts via voice, manage recurring topics, and export Obsidian-compatible markdown - fully offline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
ui = [
    "flet>=0.25",
]
speech = [
    "faster-whisper>=1.0",
    "sounddevice>=0.5",
]
sync = [
    "gitpython>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
all = [
    "tpy_lipi[ui,speech,sync,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpy_lipi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
